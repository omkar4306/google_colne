<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Homepage Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Outfit:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top navigation -->
  <header class="top-bar">
    <nav class="top-links">
      <a href="https://about.google/">About</a>
      <a href="https://store.google.com/">Store</a>
    </nav>
    <nav class="top-right">
      <a href="https://mail.google.com/">Gmail</a>
      <a href="https://www.google.com/imghp">Images</a>
      <a href="https://about.google/products/" class="apps" aria-label="Google apps">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#5f6368">
          <path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM6 14c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM6 20c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
      </a>
      <a href="https://accounts.google.com/signin" class="sign-in">Sign in</a>
    </nav>
  </header>

  <!-- Centre: logo + search -->
  <main class="center">
    <h1 class="logo" aria-label="Google">
      <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
    </h1>

    <form class="search-form" action="https://www.google.com/search" method="get">
    <div class="search-box">
      <svg class="icon search-icon" viewBox="0 0 24 24" width="20" height="20" fill="#9aa0a6">
        <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" name="q" aria-label="Search" autocomplete="off" autofocus>
      <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-label="Search by voice">
        <path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path fill="#34a853" d="M11 18.93V22h2v-3.07c3.39-.49 6-3.39 6-6.93h-2c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.54 2.61 6.44 6 6.93z"/>
        <path fill="#fbbc04" d="M5 12h2c0 .34.03.67.09 1H5.07A7 7 0 0 1 5 12z"/>
        <path fill="#ea4335" d="M17 12h2a7 7 0 0 1-.07 1h-2.02c.06-.33.09-.66.09-1z"/>
      </svg>
      <a href="https://lens.google.com/" class="lens" aria-label="Search by image"><svg class="icon" viewBox="0 0 24 24" width="22" height="22">
        <path fill="#4285f4" d="M4 4h5v2H6v3H4V4z"/>
        <path fill="#ea4335" d="M20 4v5h-2V6h-3V4h5z"/>
        <path fill="#34a853" d="M4 20v-5h2v3h3v2H4z"/>
        <path fill="#fbbc04" d="M20 20h-5v-2h3v-3h2v5z"/>
        <circle cx="12" cy="12" r="3.2" fill="#5f6368"/>
      </svg></a>
    </div>

    <div class="buttons">
      <button type="submit">Google Search</button>
      <button type="submit" formaction="https://www.google.com/doodles" formnovalidate>I'm Feeling Lucky</button>
    </div>
    </form>

    <p class="languages">
      Google offered in:
      <a href="https://www.google.com/webhp?hl=hi">हिन्दी</a>
      <a href="https://www.google.com/webhp?hl=bn">বাংলা</a>
      <a href="https://www.google.com/webhp?hl=te">తెలుగు</a>
      <a href="https://www.google.com/webhp?hl=mr">मराठी</a>
      <a href="https://www.google.com/webhp?hl=ta">தமிழ்</a>
    </p>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-top">India</div>
    <div class="footer-bottom">
      <nav>
        <a href="https://ads.google.com/">Advertising</a>
        <a href="https://www.google.com/business/">Business</a>
        <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
      </nav>
      <nav>
        <a href="https://policies.google.com/privacy">Privacy</a>
        <a href="https://policies.google.com/terms">Terms</a>
        <a href="https://www.google.com/preferences">Settings</a>
      </nav>
    </div>
  </footer>

</body>
</html>
